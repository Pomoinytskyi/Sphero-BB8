[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bb8ctl"
version = "0.1.0"
description = "Xbox-controller driver and Bluetooth protocol lab for the Sphero BB-8"
requires-python = ">=3.13"
dependencies = [
    "bleak>=0.22",
    "pygame>=2.6",
    "textual>=0.80",
    "rich>=13.0",
]

[project.optional-dependencies]
# spherov2 is NOT a runtime dependency (see docs/05 AD2). It is kept only as an
# A/B oracle: if our hand-rolled handshake fails on hardware, we can test a
# known-good implementation against the same droid in the same session.
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "spherov2>=0.12"]

[project.scripts]
bb8ctl = "bb8ctl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
